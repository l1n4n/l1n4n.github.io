title: "Nan Li"
description: "PhD candidate in CS and philosophy. Thinking about AI, language, and moral judgment."
url: "" # will be https://<username>.github.io
baseurl: "" # leave empty if using <username>.github.io repo

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Pagination (optional, needs jekyll-paginate)
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Author info — customize these
author:
  name: "Nan Li"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
